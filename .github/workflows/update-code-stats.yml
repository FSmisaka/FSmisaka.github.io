name: Update code stats

on:
  schedule:
    # 03:23 UTC daily — contribution snapshots stay fresh enough for a
    # personal site while keeping LeetCode's public GraphQL usage polite.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write # commit refreshed snapshots back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh contribution snapshots
        run: python3 scripts/fetch_contrib_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh code contribution snapshots"
            git push
          fi
