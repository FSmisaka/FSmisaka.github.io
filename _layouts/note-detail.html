---
layout: default
---

{% include base_path %}

<article itemscope itemtype="http://schema.org/CreativeWork">
  <div class="article-wrap" itemprop="text">

    <p class="detail-back"><a href="{{ '/notes/' | relative_url }}">&larr; Notes</a></p>

    <header class="detail-header">
      <h1 class="detail-title" itemprop="headline">{{ page.title }}</h1>
      {% if page.date %}
      <p class="detail-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></p>
      {% endif %}
      <hr />
    </header>

    <div class="note-body" itemprop="text">
      {{ content }}
    </div>

    <p class="detail-back"><a href="{{ '/notes/' | relative_url }}">&larr; Back to Notes</a></p>
  </div><!-- /.article-wrap -->
</article>

<!-- TOC + back-to-top (shared JS) -->
<script defer src="{{ '/assets/js/detail-page.js' | relative_url }}"></script>

<!--
  kramdown with math_engine:mathjax wraps $...$ in <script type="math/tex"> tags.
  MathJax 3 doesn't process those — convert back to standard delimiters first.
-->
<script defer>
  (function() {
    document.querySelectorAll('script[type="math/tex; mode=display"]').forEach(function(el) {
      var div = document.createElement('div');
      div.textContent = '$$' + el.textContent + '$$';
      el.parentNode.replaceChild(div, el);
    });
    document.querySelectorAll('script[type="math/tex"]').forEach(function(el) {
      var span = document.createElement('span');
      span.textContent = '$' + el.textContent + '$';
      el.parentNode.replaceChild(span, el);
    });
  })();
</script>
<!-- MathJax config: must appear BEFORE the MathJax script -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
