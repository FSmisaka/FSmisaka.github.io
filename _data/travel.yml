# Travel records — grouped by continent on the Travel page.
#
# Each record:
#   date   – year and month, shown in gray (e.g. "2026 Jul")
#   place  – city / country
#   title  – the highlight / strongest impression (black title after the gray meta)
#   photos – up to 8 image paths under /images/ (hover reveals a 2x4 grid);
#            missing entries render as neutral placeholder tiles
#
# Example:
#   - date: "2025 Aug"
#     place: "Kyoto, Japan"
#     title: "Temples at dawn — the quietest hour in the city."
#     photos: ["travel/kyoto-1.jpg", "travel/kyoto-2.jpg"]
#
# Continents with no trips show "No trips yet." — fill in the trips lists.

